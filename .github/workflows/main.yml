name: DumprX SEPolicy

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL репозитория с дампом прошивки (dumpyara/DumprX)'
        required: true
      dump_branch:
        description: 'Ветка дампа (пусто = ветка по умолчанию)'
        required: false
        default: ''
      sepolicy_branch:
        description: 'Ветка LineageOS/android_system_sepolicy'
        required: false
        default: 'lineage-23.2'
      current:
        description: 'Использовать текущие макросы (--current) вместо prebuilts/api'
        type: boolean
        required: false
        default: false

jobs:
  decompile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flex bison git-lfs
          python -m pip install -r requirements.txt

      - name: Cache checkpolicy/secilc
        uses: actions/cache@v6
        with:
          path: out/host/linux-x86/bin
          key: selinux-tools-3.9-${{ runner.os }}-${{ runner.arch }}

      - name: Cache system/sepolicy
        uses: actions/cache@v6
        with:
          path: system/sepolicy
          key: system-sepolicy-${{ inputs.sepolicy_branch }}

      - name: Decompile
        env:
          PYTHON: python
          REPO_URL: ${{ inputs.repo_url }}
          DUMP_BRANCH: ${{ inputs.dump_branch }}
          SEPOLICY_BRANCH: ${{ inputs.sepolicy_branch }}
          USE_CURRENT: ${{ inputs.current }}
        run: |
          args=(-d "$REPO_URL" -o output -b "$SEPOLICY_BRANCH")
          if [ -n "$DUMP_BRANCH" ]; then
            args+=(--dump-branch "$DUMP_BRANCH")
          fi
          if [ "$USE_CURRENT" = "true" ]; then
            args+=(--current)
          fi
          ./decompile.sh "${args[@]}"

      - name: Summary
        if: always()
        run: |
          if [ -d output ]; then
            {
              echo "### Decompiled SELinux policy"
              echo '```'
              find output -type f | sort | sed 's|^output/||'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload decompiled policy
        uses: actions/upload-artifact@v7
        with:
          name: decompiled_sepolicy
          path: output/
          if-no-files-found: error
